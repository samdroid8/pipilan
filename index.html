<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow"><meta name="theme-color" content="#050505"><title>PIPILAN — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Technocra PIPILAN';src:url('./assets/technocra-logo.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}

:root{--green:#C4F36D;--red:#FA1309;--yellow:#ffce4b;--orange:#ff8738;--bg:#050505}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#fafafa;background:var(--bg);font-family:'Pixelify Sans',monospace;font-weight:500}button{font:inherit;cursor:pointer}a{color:inherit}.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 40% 32% at 5% 30%,#b4f85a20,transparent),radial-gradient(ellipse 40% 30% at 95% 35%,#FA13091d,transparent),radial-gradient(ellipse 35% 25% at 50% 100%,#ff9c2520,transparent)}.backdrop:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 25% 35% at 0% 15%,#c4f36d0b,transparent 85%),radial-gradient(ellipse 24% 40% at 100% 82%,#fa13090c,transparent 85%)}.floor{display:none}.wire{position:absolute;pointer-events:none;fill:none;stroke-width:3;z-index:0;filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 15px currentColor);transition:filter .3s ease,stroke-width .3s ease;opacity:.8}.wire.a{width:38vw;left:-4vw;top:8vh;color:#C4F36D;stroke:var(--green)}.wire.b{width:30vw;right:-3vw;top:48vh;color:#FA1309;stroke:var(--red)}.wire.lit{stroke-width:4.2;opacity:1;filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor) drop-shadow(0 0 35px currentColor)}.shell{position:relative;z-index:1;width:min(1100px,94%);margin:0 auto;padding:28px 0 48px}nav{display:flex;align-items:center;gap:5px;padding:5px;border:2px solid transparent;border-radius:50px;background:linear-gradient(#070707,#070707) padding-box,linear-gradient(100deg,var(--green),var(--yellow),var(--orange),var(--red)) border-box;box-shadow:0 0 14px #c4f36d38;overflow-x:auto;scrollbar-width:none;transition:box-shadow .25s ease,filter .25s ease}nav:hover{box-shadow:0 0 12px #c4f36d9a,0 0 27px #c4f36d5a,0 0 40px #fa130942}nav button{border:0;background:none;color:white;white-space:nowrap;padding:11px 18px;border-radius:35px;font-weight:700;font-size:15px}nav button.active,nav button:hover{background:var(--green);color:#060606}main{min-height:60vh}.logo{margin:60px 0 65px;text-align:center;line-height:.95;font-family:'Technocra PIPILAN','Pixelify Sans',monospace;font-weight:400;letter-spacing:-.02em;font-size:clamp(62px,14vw,156px);background:linear-gradient(90deg,var(--green) 0 24%,#f4ef50 39%,#ff9635 64%,var(--red) 94%);color:transparent;background-clip:text;-webkit-background-clip:text;font-style:normal}.hero-accent{display:flex;justify-content:center;gap:10px;margin:30px 0 50px}.hero-accent span{width:46px;height:3px;background:var(--green);transform:skewX(-28deg);transition:box-shadow .25s,filter .25s}.hero-accent span:hover{filter:brightness(1.5);box-shadow:0 0 10px currentColor,0 0 22px currentColor}.hero-accent span:nth-child(2){background:var(--yellow)}.hero-accent span:nth-child(3){background:var(--orange)}.hero-accent span:nth-child(4){background:var(--red)}.hero-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:24px}.outline{border:2px solid transparent;border-radius:20px;background:linear-gradient(#080808,#080808) padding-box,linear-gradient(120deg,var(--green),var(--yellow),var(--orange),var(--red)) border-box;box-shadow:0 0 20px #c4f36d24;overflow:hidden;transition:box-shadow .25s ease,filter .25s ease}.outline:hover{box-shadow:0 0 13px #C4F36D9a,0 0 25px #ff9d4066,0 0 34px #FA13094a}.video-box{aspect-ratio:16/9;position:relative;background:#101010 url('https://img.youtube.com/vi/O8WXs8XIxFU/hqdefault.jpg') center/cover no-repeat;display:grid;place-items:center}.video-box:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 65%,#000b);pointer-events:none}.video-box button{z-index:1;width:70px;height:70px;border:3px solid var(--green);border-radius:50%;background:#060606d8;color:var(--green);font-size:26px;box-shadow:0 0 18px #c4f36d55}.video-box button:hover{transform:scale(1.07)}.info{padding:25px;display:flex;flex-direction:column;justify-content:center;gap:15px}.info h2{color:var(--green);font-size:30px;margin:0}.rule{height:2px;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));transition:filter .2s,box-shadow .2s}.rule:hover{filter:brightness(1.3);box-shadow:0 0 12px #C4F36D,0 0 24px #FA130988}.muted{color:#aaa;font-size:15px}.info b{font-size:22px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin:50px 0 22px}.tile{border:2px solid var(--accent);background:#080808d9;color:white;padding:25px 8px;min-height:150px;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;box-shadow:0 0 16px color-mix(in srgb,var(--accent) 27%,transparent);font-size:20px;font-weight:700;text-align:center;transition:transform .2s}.tile:hover{transform:translateY(-5px);box-shadow:0 0 14px var(--accent),0 0 30px color-mix(in srgb,var(--accent) 70%,transparent),0 0 45px color-mix(in srgb,var(--accent) 35%,transparent)}.tile .symbol{font-size:35px;color:var(--accent)}.scroll{text-align:center;font-size:40px;color:var(--green);margin:20px}.page-title{font-family:'Pixelify Sans',monospace;font-weight:700;letter-spacing:-.025em;font-size:clamp(37px,7vw,65px);margin:50px 0 20px;color:var(--green);text-transform:uppercase}.subtitle{color:#ccc;font-size:19px;max-width:720px}.panel{border:1px solid #c4f36d85;background:#090b09dd;border-radius:18px;padding:24px;margin:22px 0}.panel h2{margin:0 0 12px;font-size:25px}.panel p{font-size:18px;line-height:1.55;color:#e1e1e1}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin:35px 0}.game{border:2px solid var(--accent);background:#090909;border-radius:17px;padding:26px;min-height:180px;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 22%,transparent)}.game .num{font-size:17px;color:var(--accent)}.game h2{font-size:32px;margin:20px 0 8px}.game p{color:#bbb;margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tabs button{padding:11px 17px;background:#0a0a0a;border:1px solid var(--green);border-radius:25px;color:#fff}.tabs button.selected{background:var(--green);color:#030303}.cta{display:inline-block;border:1px solid var(--green);color:var(--green);background:#0c0f08;border-radius:28px;padding:14px 20px;text-decoration:none}.placeholder{border:1px dashed #c4f36d77;border-radius:14px;padding:35px 20px;text-align:center;color:#bbb;margin:18px 0}.footer{border-top:1px solid #c4f36d66;padding-top:22px;margin-top:60px;color:#aaa;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer strong{color:var(--green)}@media(max-width:680px){.shell{width:94%;padding-top:13px}nav button{padding:10px 14px;font-size:13px}.logo{font-size:clamp(49px,13.4vw,94px);margin-top:46px}.hero-accent{margin:25px 0 35px}.hero-grid{grid-template-columns:1fr;gap:15px}.info{padding:20px}.tiles{grid-template-columns:repeat(2,1fr);gap:13px;margin-top:28px}.tile{min-height:110px;font-size:16px;padding:15px 5px}.cards{grid-template-columns:1fr}.page-title{margin-top:34px}.wire.a{width:90vw}.wire.b{width:70vw}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Points néon en mouvement : un faisceau qui suit les bords, avec sa traînée */
nav,.outline,.tile,.panel{position:relative}
.edge-runner{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
.edge-runner rect{fill:none;stroke-linecap:round;stroke-linejoin:round}
.edge-runner .trail{stroke:var(--runner-color,#C4F36D);stroke-width:4;opacity:.55;filter:drop-shadow(0 0 7px var(--runner-color,#C4F36D));}
.edge-runner .head{stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px var(--runner-color,#C4F36D));}

}
nav:hover .edge-runner .head,.outline:hover .edge-runner .head,.tile:hover .edge-runner .head{stroke-width:5;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 18px var(--runner-color,#C4F36D))}
.hero-lockup{display:flex;align-items:center;justify-content:center;gap:0;margin:54px auto 50px;max-width:1060px}
.hero-lockup .logo{flex:1;min-width:0;margin:0;text-align:center;font-size:clamp(52px,10.8vw,128px)}
.hero-controller{width:31%;max-width:315px;min-width:110px;height:auto;object-fit:contain;filter:drop-shadow(0 0 5px #C4F36D5c) drop-shadow(0 0 7px #FA13093b);transform:rotate(0deg);transition:filter .25s ease}
.hero-controller:hover{filter:drop-shadow(0 0 9px #C4F36D7a) drop-shadow(0 0 11px #FA13094a);transform:none}
@media(max-width:680px){.hero-lockup{margin:30px auto 38px}.hero-lockup .logo{font-size:clamp(38px,10.5vw,75px)}.hero-controller{width:35%;min-width:94px}}
@media(prefers-reduced-motion:reduce){.edge-runner rect{animation:none;stroke-dasharray:0 999999!important}}
</style><link rel="icon" type="image/webp" href="./assets/pipilan-controller-original.webp"></head><body>
<div class="backdrop"></div><div class="floor"></div>
<svg class="wire a" viewBox="0 0 500 240" aria-hidden="true"><path d="M-30 190 H45 Q75 190 110 140 L188 43 Q200 25 235 25 H530"/><path d="M-30 214 H48 Q86 214 126 156 L204 64 Q222 45 245 45 H530" opacity=".5"/></svg>
<svg class="wire b" viewBox="0 0 450 270" aria-hidden="true"><path d="M-20 232 H230 Q255 232 275 207 L354 45 Q367 22 400 22 H475"/><path d="M-20 256 H250 Q270 256 290 227 L375 66 Q387 45 416 45 H475" opacity=".55"/></svg>
<div class="shell"><nav id="nav" aria-label="Menu principal">
<button data-page="accueil" class="active">Accueil</button><button data-page="programme">Programme</button><button data-page="jeux">Jeux & tournois</button><button data-page="classements">Classements</button><button data-page="infos">Infos pratiques</button><button data-page="archives">Archives</button><button data-page="partenaires">Partenaires</button>
</nav><main id="app"></main><footer class="footer"><strong>PIPILAN</strong><span>Prototype de l'événement · Informations à confirmer</span></footer></div>
<script>
const app=document.querySelector('#app');
const controllerArt='<img class="hero-controller" src="./assets/pipilan-controller.webp" alt="Manette PIPILAN" loading="eager" decoding="async">';
const games=[['Halo Infinite','FPS multijoueur','#C4F36D'],['Witch It','Cache-cache multijoueur','#ffdf55'],['Golf With Your Friends','Mini-golf multijoueur','#ff8e39'],['Jeu mystère','Révélation à venir','#FA1309']];
function home(){return '<div class="hero-lockup"><h1 class="logo">PIPILAN</h1>'+controllerArt+'</div><div class="hero-grid"><div class="outline"><div class="video-box"><button id="preview" title="Teaser à intégrer au format MP4">▶</button></div></div><div class="outline info"><h2>◫ PIPILAN</h2><div class="rule"></div><span class="muted">PROCHAINE ÉDITION</span><b>Date à annoncer</b><span class="muted">Lieu à confirmer</span><div class="rule"></div><span class="muted">Inscriptions directement auprès des organisateurs</span></div></div><div class="tiles"><button class="tile" data-page="jeux" style="--accent:#C4F36D"><span class="symbol">⌘</span>JEUX & TOURNOIS</button><button class="tile" data-page="archives" style="--accent:#ffe05b"><span class="symbol">▧</span>ARCHIVES</button><button class="tile" data-page="programme" style="--accent:#ff923d"><span class="symbol">▦</span>PROGRAMME</button><button class="tile" data-page="infos" style="--accent:#FA1309"><span class="symbol">ⓘ</span>INFOS PRATIQUES</button></div><div class="scroll">⌄</div><section class="panel"><h2>Bienvenue à PIPILAN</h2><p>Quatre tournois : Halo Infinite, Witch It, Golf With Your Friends et un jeu mystère. Les équipes de trois joueurs sont reformées après chaque jeu.</p></section>'}
const headings={programme:'Programme',jeux:'Jeux & tournois',classements:'Classements',infos:'Infos pratiques',archives:'Archives',partenaires:'Partenaires'};
function page(p){let start='<h1 class="page-title">'+headings[p]+'</h1><div class="rule"></div>';if(p==='jeux')return start+'<p class="subtitle">Quatre tournois organisés. Les équipes de trois sont recomposées après chaque jeu.</p><div class="cards">'+games.map((g,i)=>'<article class="game" style="--accent:'+g[2]+'"><div class="num">TOURNOI 0'+(i+1)+'</div><h2>'+g[0]+'</h2><p>'+g[1]+'</p><p>Format et horaires à confirmer.</p></article>').join('')+'</div>';if(p==='classements')return start+'<p class="subtitle">Classements par tournoi et classement général individuel cumulant les résultats des jeux terminés.</p><div class="tabs" id="tabs"><button class="selected" data-tab="general">Général individuel</button>'+games.map((g,i)=>'<button data-tab="'+i+'">'+g[0]+'</button>').join('')+'</div><div class="placeholder" id="ranking">Les résultats seront visibles ici après validation des organisateurs.</div>';if(p==='programme')return start+'<div class="panel"><h2>Programme à venir</h2><p>Les horaires et les animations seront ajoutés dès qu’ils seront fixés.</p></div>';if(p==='infos')return start+'<div class="panel"><h2>Préparer sa venue</h2><p>Adresse, horaires, accès et matériel à prévoir seront communiqués ici. Les joueurs s’inscrivent directement auprès de l’organisation : pas de formulaire d’inscription en ligne.</p></div>';if(p==='archives')return start+'<div class="panel"><h2>Éditions précédentes</h2><p>Cette page accueillera les photos, vidéos et souvenirs des anciennes PIPILAN.</p></div>';return start+'<div class="panel"><h2>Nos partenaires</h2><p>Les logos et présentations des partenaires seront ajoutés une fois confirmés.</p></div>'}

let edgeObserver;
function attachEdgeRunners(){
 if(edgeObserver)edgeObserver.disconnect();
 if(!window.ResizeObserver)return;
 edgeObserver=new ResizeObserver(entries=>entries.forEach(e=>drawRunner(e.target)));
 document.querySelectorAll('nav,.outline,.tile,.panel').forEach((el,i)=>{
   if(!el.querySelector(':scope > svg.edge-runner')){
     const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
     svg.classList.add('edge-runner');svg.setAttribute('aria-hidden','true');
     svg.innerHTML='<rect class="base"/><rect class="tail-far"/><rect class="tail-mid"/><rect class="tail-near"/><rect class="spark"/>';
     el.appendChild(svg);
   }
   el.style.setProperty('--runner-color',el.style.getPropertyValue('--accent')||['#C4F36D','#ffcf4b','#ff9038','#FA1309'][i%4]);
   el.dataset.runnerSpeed=String(5800+(i%4)*700);
   edgeObserver.observe(el);drawRunner(el);
 });
}
function drawRunner(el){
 const svg=el.querySelector(':scope > svg.edge-runner');if(!svg)return;
 const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;
 const rad=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||18,Math.min(w,h)/2);
 svg.setAttribute('viewBox','0 0 '+w+' '+h);
 svg.setAttribute('width',w);svg.setAttribute('height',h);
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 for(const rect of svg.querySelectorAll('rect')){
  rect.getAnimations().forEach(a=>a.cancel());
  rect.setAttribute('x','2');rect.setAttribute('y','2');
  rect.setAttribute('width',Math.max(w-4,1));rect.setAttribute('height',Math.max(h-4,1));
  rect.setAttribute('rx',Math.max(rad-2,0));
  const len=rect.getTotalLength(),cls=rect.getAttribute('class');
  if(cls==='base'){rect.style.strokeDasharray='none';continue;}
  const seg={ 'tail-far':130,'tail-mid':85,'tail-near':42,'spark':9 }[cls]||20;
  const dash=Math.min(seg,len*.22);
  rect.style.strokeDasharray=dash+' '+(len-dash);
  rect.style.strokeDashoffset='0';
  if(!reduce){
   rect.animate([{strokeDashoffset:'0'},{strokeDashoffset:String(-len)}],
   {duration:Number(el.dataset.runnerSpeed)||6000,iterations:Infinity,easing:'linear'});
  }
 }
}
function go(p){if(!headings[p]&&p!=='accueil')p='accueil';app.innerHTML=p==='accueil'?home():page(p);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));history.replaceState(null,'','#'+p);attachEdgeRunners();scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){go(b.dataset.page);return}const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===t));document.querySelector('#ranking').textContent='Aucun résultat publié pour '+(t.dataset.tab==='general'?'le classement général':games[Number(t.dataset.tab)][0])+'.';return}if(e.target.closest('#preview')){const x=e.target.closest('#preview');x.textContent='Vidéo MP4 à venir';x.style.width='auto';x.style.padding='15px 20px';x.style.fontSize='14px';x.style.borderRadius='28px'}});
go(location.hash.slice(1)||'accueil');

const neonWires=[...document.querySelectorAll('.wire')].map(svg=>({svg,paths:[...svg.querySelectorAll('path')]}));
let lastPoint=null;
function glowNearby(x,y){
 for(const {svg,paths} of neonWires){
  let near=false;
  for(const path of paths){
   const len=path.getTotalLength(),matrix=path.getScreenCTM();
   if(!matrix)continue;
   const step=Math.max(1,Math.ceil(len/44));
   for(let i=0;i<=step;i++){
    const p=path.getPointAtLength(len*i/step);
    const sx=p.x*matrix.a+p.y*matrix.c+matrix.e;
    const sy=p.x*matrix.b+p.y*matrix.d+matrix.f;
    if((sx-x)**2+(sy-y)**2<75*75){near=true;break}
   }
   if(near)break;
  }
  svg.classList.toggle('lit',near);
 }
}
let scheduled=false;
document.addEventListener('pointermove',ev=>{
 if(ev.pointerType==='touch')return;
 lastPoint={x:ev.clientX,y:ev.clientY};
 if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;if(lastPoint)glowNearby(lastPoint.x,lastPoint.y)})}
});
document.addEventListener('pointerleave',()=>neonWires.forEach(({svg})=>svg.classList.remove('lit')));
</script></body></html>
