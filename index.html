/* Contour fixe au repos, reflet lumineux doux uniquement au survol */
nav,.outline,.tile,.panel{position:relative;isolation:isolate}
.edge-runner{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.edge-runner rect{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.edge-runner .base{stroke:var(--runner-color,#C4F36D);stroke-width:1.4;opacity:.15}
.edge-runner .soft-halo{stroke:var(--runner-color,#C4F36D);stroke-width:10;opacity:0;filter:blur(6px)}
.edge-runner .wide-glow{stroke:var(--runner-color,#C4F36D);stroke-width:6;opacity:0;filter:blur(3px)}
.edge-runner .light-trail{stroke:var(--runner-color,#C4F36D);stroke-width:2.8;opacity:0;filter:drop-shadow(0 0 3px var(--runner-color,#C4F36D))}
.edge-runner .light-head{stroke:#fff;stroke-width:2.5;opacity:0;filter:drop-shadow(0 0 3px #fff)}
.edge-runner .soft-halo,.edge-runner .wide-glow,.edge-runner .light-trail,.edge-runner .light-head{transition:opacity .18s ease}
nav:hover .edge-runner .soft-halo,nav:hover .edge-runner .wide-glow,nav:hover .edge-runner .light-trail,nav:hover .edge-runner .light-head,
.outline:hover .edge-runner .soft-halo,.outline:hover .edge-runner .wide-glow,.outline:hover .edge-runner .light-trail,.outline:hover .edge-runner .light-head,
.tile:hover .edge-runner .soft-halo,.tile:hover .edge-runner .wide-glow,.tile:hover .edge-runner .light-trail,.tile:hover .edge-runner .light-head,
.panel:hover .edge-runner .soft-halo,.panel:hover .edge-runner .wide-glow,.panel:hover .edge-runner .light-trail,.panel:hover .edge-runner .light-head{opacity:1}
@media(prefers-reduced-motion:reduce){.edge-runner .soft-halo,.edge-runner .wide-glow,.edge-runner .light-trail,.edge-runner .light-head{display:none}}
.hero-lockup{display:flex;align-items:center;justify-content:center;gap:0;margin:54px auto 50px;max-width:1060px}
.hero-lockup .logo{flex:1;min-width:0;margin:0;text-align:center;font-size:clamp(52px,10.8vw,128px)}
.hero-controller{width:31%;max-width:315px;min-width:110px;height:auto;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 5px #C4F36D45);transform:none;transition:filter .3s ease}
.hero-controller:hover{filter:drop-shadow(0 0 8px #C4F36D6b);transform:none}
@media(max-width:680px){.hero-lockup{margin:30px auto 38px}.hero-lockup .logo{font-size:clamp(38px,10.5vw,75px)}.hero-controller{width:35%;min-width:94px}}

/* Effet de contour cohérent sur tous les encarts et boutons */
.neon-target{position:relative;isolation:isolate}
.neon-target>.edge-runner{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible;flex:none}
.neon-target:hover>.edge-runner .soft-halo,
.neon-target:hover>.edge-runner .wide-glow,
.neon-target:hover>.edge-runner .light-trail,
.neon-target:hover>.edge-runner .light-head,
.neon-target:focus-within>.edge-runner .soft-halo,
.neon-target:focus-within>.edge-runner .wide-glow,
.neon-target:focus-within>.edge-runner .light-trail,
.neon-target:focus-within>.edge-runner .light-head{opacity:1}
.neon-target:focus-visible{outline:2px solid #C4F36D;outline-offset:3px}
@media(prefers-reduced-motion:reduce){
 .neon-target>.edge-runner .soft-halo,
 .neon-target>.edge-runner .wide-glow,
 .neon-target>.edge-runner .light-trail,
 .neon-target>.edge-runner .light-head{display:none}
}

const backgroundNeon=document.querySelector('.neon-network');
const backgroundPaths=[...backgroundNeon.querySelectorAll('.network-lines path')];
const neonHighlight=document.createElementNS('http://www.w3.org/2000/svg','g');
neonHighlight.classList.add('network-interactive');
backgroundPaths.forEach((source,index)=>{
 const group=document.createElementNS('http://www.w3.org/2000/svg','g');
 group.classList.add('network-highlight');
 group.dataset.index=index;
 for(const className of ['highlight-halo','highlight-glow','highlight-core']){
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',source.getAttribute('d'));
  path.classList.add(className);
  group.appendChild(path);
 }
 neonHighlight.appendChild(group);
});
backgroundNeon.appendChild(neonHighlight);
let neonSamples=[],lastPointer=null,neonMoveFrame=0,activeBackgroundLine=-1;
function cacheBackgroundNeon(){
 const rect=backgroundNeon.getBoundingClientRect();
 neonSamples=backgroundPaths.map(path=>{
  const length=path.getTotalLength(),samples=[];
  for(let k=0;k<=Math.ceil(length/16);k++){
   const point=path.getPointAtLength(Math.min(length,k*16));
   samples.push([rect.left+point.x/1440*rect.width,rect.top+point.y/1000*rect.height]);
  }
  return samples;
 });
 if(lastPointer)updateBackgroundNeon(lastPointer.x,lastPointer.y);
}
function setBackgroundLine(index){
 if(activeBackgroundLine===index)return;
 activeBackgroundLine=index;
 [...neonHighlight.children].forEach((group,i)=>group.classList.toggle('lit',i===index));
}
function updateBackgroundNeon(x,y){
 
 let best=45*45,index=-1;
 neonSamples.forEach((points,i)=>{
  for(const [px,py] of points){
   const distance=(px-x)**2+(py-y)**2;
   if(distance<best){best=distance;index=i;}
  }
 });
 setBackgroundLine(index);
}
document.addEventListener('pointermove',event=>{
 if(event.pointerType==='touch')return;
 lastPointer={x:event.clientX,y:event.clientY};
 if(neonMoveFrame)return;
 neonMoveFrame=requestAnimationFrame(()=>{
  neonMoveFrame=0;
  if(lastPointer)updateBackgroundNeon(lastPointer.x,lastPointer.y);
 });
},{passive:true});
document.addEventListener('pointerout',e=>{if(!e.relatedTarget)setBackgroundLine(-1)});
window.addEventListener('resize',cacheBackgroundNeon,{passive:true});
cacheBackgroundNeon();

document.addEventListener('pointermove',e=>{
 const target=e.target instanceof Element?e.target:null;
 setArchiveNeon(target?.closest('.archive-main .neon-target')||target?.closest('.archive-main.neon-target')||null);
},{passive:true});
document.addEventListener('pointerleave',()=>setArchiveNeon(null));
document.addEventListener('focusin',e=>{
 const target=e.target instanceof Element?e.target:null;
 const archive=target?.closest('.archive-main');
 if(archive)setArchiveNeon(target.closest('.neon-target')||archive);
});
document.addEventListener('focusout',e=>{
 if(!e.relatedTarget?.closest?.('.archive-main'))setArchiveNeon(null);
});
function attachEdgeRunners(){
 if(edgeObserver)edgeObserver.disconnect();
 if(!window.ResizeObserver)return;
 edgeObserver=new ResizeObserver(entries=>{
  for(const {target} of entries){
   drawRunner(target);
   if(((!target.matches('.archive-main')&&!target.closest('.archive-main')) || target===activeArchiveNeon) && (target.matches(':hover') || target.contains(document.activeElement))){
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)animateRunner(target);
   }
  }
 });
 const targets='nav,.outline,.tile,.panel,.rankings-intro,.game-card,.game-detail,.tabs button,.placeholder,.archive-main,.archive-window,.archive-choice,.discord-link,.cta,.video-box button,.game-page-art,.game-section,.game-back,.fake-sponsor';
 document.querySelectorAll('nav button').forEach(btn=>{btn.classList.remove('neon-target');btn.querySelector(':scope > svg.edge-runner')?.remove();});
 document.querySelectorAll(targets).forEach((el,i)=>{
  el.classList.add('neon-target');
  let svg=el.querySelector(':scope > svg.edge-runner');
  if(!svg){
   svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
   svg.classList.add('edge-runner');svg.setAttribute('aria-hidden','true');
   svg.innerHTML='<rect class="base"/><rect class="soft-halo"/><rect class="wide-glow"/><rect class="light-trail"/><rect class="light-head"/>';
   el.appendChild(svg);
  }
  const accent=el.style.getPropertyValue('--accent')||
   (el.classList.contains('archive-choice')?getComputedStyle(el).getPropertyValue('--year-color'):'')||
   (el.classList.contains('discord-link')?'#9484ff':'')||
   ['#C4F36D','#ffce4b','#ff8738','#FA1309'][i%4];
  el.style.setProperty('--runner-color',accent.trim());
  if(!el.dataset.neonInitialized){
   el.addEventListener('pointerenter',()=>{if(!el.matches('.archive-main')&&!el.closest('.archive-main')&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)animateRunner(el)},{passive:true});
   el.addEventListener('pointerleave',()=>stopRunner(el),{passive:true});
   el.addEventListener('focusin',()=>{if(!el.closest('.archive-main')&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)animateRunner(el)});
   el.addEventListener('focusout',e=>{if(!el.contains(e.relatedTarget))stopRunner(el)});
   el.dataset.neonInitialized='true';
  }
  edgeObserver.observe(el);
  drawRunner(el);
 });
}
function stopRunner(el){
 el.querySelectorAll(':scope > svg.edge-runner rect').forEach(rect=>rect.getAnimations().forEach(anim=>anim.cancel()));
}
function animateRunner(el){
 stopRunner(el);
 const rects=el.querySelectorAll(':scope > svg.edge-runner rect:not(.base)');
 const len=Number(el.dataset.pathLength)||0;
 if(!len)return;
 rects.forEach(rect=>{
   const cls=rect.getAttribute('class');
   const offset=({'soft-halo':80,'wide-glow':50,'light-trail':23,'light-head':0})[cls]||0;
   rect.animate(
    [{strokeDashoffset:String(offset)},{strokeDashoffset:String(offset-len)}],
    {duration:4400,iterations:Infinity,easing:'linear',fill:'forwards'}
   );
 });
}
function drawRunner(el){
 const svg=el.querySelector(':scope > svg.edge-runner');if(!svg)return;
 stopRunner(el);
 const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;
 const rad=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||18,Math.min(w,h)/2);
 svg.setAttribute('viewBox','0 0 '+w+' '+h);
 svg.setAttribute('width',w);svg.setAttribute('height',h);
 let len=0;
 for(const rect of svg.querySelectorAll('rect')){
  rect.setAttribute('x','3');rect.setAttribute('y','3');
  rect.setAttribute('width',Math.max(w-6,1));rect.setAttribute('height',Math.max(h-6,1));
  rect.setAttribute('rx',Math.max(rad-3,0));
  len=rect.getTotalLength();
  if(rect.classList.contains('base')){rect.style.strokeDasharray='none';continue}
  const dash=({'soft-halo':160,'wide-glow':110,'light-trail':64,'light-head':10})[rect.getAttribute('class')]||10;
  const d=Math.min(dash,len*.26);
  rect.style.strokeDasharray=d+' '+Math.max(1,len-d);
  rect.style.strokeDashoffset='0';
 }
 el.dataset.pathLength=String(len);
}
function go(p,replace=false){if(!headings[p]&&p!=='accueil'&&p!=='archives-2024'&&!gameSlugs.some(slug=>p==='jeu-'+slug))p='accueil';app.innerHTML=p==='accueil'?home():page(p);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===(p.startsWith('jeu-')?'jeux':p==='archives-2024'?'archives':p)));if(location.hash.slice(1)!==p){history[replace?'replaceState':'pushState'](null,'','#'+p)}attachEdgeRunners();if(lastPointer)updateBackgroundNeon(lastPointer.x,lastPointer.y);updateCountdown();scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{
const card=e.target.closest('[data-game]');if(card){if(Number(card.dataset.game)===3)return;e.preventDefault();go('jeu-'+gameSlugs[Number(card.dataset.game)]);return;}
const archive=e.target.closest('[data-archive-year]');if(archive){const year=archive.dataset.archiveYear;if(year==='2024'){go('archives-2024');return;}document.querySelectorAll('.archive-choice').forEach(b=>{const selected=b.dataset.archiveYear===year;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});const desc=document.querySelector('.archive-description');if(desc){desc.querySelector('.archive-eyebrow').textContent='DOSSIER / '+year;desc.querySelector('h3').textContent='Édition '+year;}return;}
const b=e.target.closest('[data-page]');if(b){go(b.dataset.page);return}const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===t));document.querySelector('#ranking').textContent='Aucun résultat publié pour '+(t.dataset.tab==='general'?'le classement général':games[Number(t.dataset.tab)][0])+'.';return}if(e.target.closest('#preview')){const x=e.target.closest('#preview');x.textContent='Vidéo MP4 à venir';x.style.width='auto';x.style.padding='15px 20px';x.style.fontSize='14px';x.style.borderRadius='28px'}});
window.addEventListener('popstate',()=>go(location.hash.slice(1)||'accueil',true));
go(location.hash.slice(1)||'accueil',true);

</script></body></html>
